name: Build FOSS Android production APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: foss-android-production-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      APP_VARIANT: production

    steps:
      - name: Check out app
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Verify production FOSS config
        run: |
          npx expo config --type public --json > expo-config.json
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('expo-config.json', 'utf8'));
          const appVersion = require('./app.version');
          const expectedVersion = String(appVersion.version);
          const expectedVersionCode = Number(appVersion.androidVersionCode.production);
          const expectedTag = `v${expectedVersion}-foss`;
          if (config.android?.package !== 'online.everfind.app.foss') {
            throw new Error(`Unexpected Android package: ${config.android?.package}`);
          }
          if (config.version !== expectedVersion) {
            throw new Error(`Unexpected version: ${config.version}`);
          }
          if (config.android?.versionCode !== expectedVersionCode) {
            throw new Error(`Unexpected Android versionCode: ${config.android?.versionCode}`);
          }
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match expected ${expectedTag}`);
          }
          NODE

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build production APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: everfind-foss-production-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
